<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分用なろうリーダー</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0066cc;
            --border-color: #e0e0e0;
        }

        body.dark {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --accent-color: #4d94ff;
            --border-color: #444444;
        }

        body.sepia {
            --bg-color: #f4ecd8;
            --card-bg: #fdf6e3;
            --text-color: #5b4636;
            --accent-color: #b58900;
            --border-color: #e0d7c3;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            margin: 0;
            font-size: 18px;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button, select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
        }

        button.primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .tab-menu {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
        }

        .bookmarks-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .bm-item {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-view {
            display: none;
        }

        .section-view.active {
            display: block;
        }

        .reader-content {
            font-size: 18px;
            line-height: 1.8;
            margin-top: 20px;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            gap: 10px;
        }

        .episodes-list {
            max-height: 350px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 10px;
        }

        .ep-item {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .ep-item:hover {
            background-color: rgba(0,0,0,0.05);
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 自分用なろうリーダー</h1>
        <div class="controls">
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="light">ライト</option>
                <option value="dark">ダーク</option>
                <option value="sepia">セピア</option>
            </select>
        </div>
    </header>

    <div class="container">

        <div class="tab-menu">
            <button id="tabSearchBtn" class="tab-btn active" onclick="switchTab('search')">🔍 検索・閲覧</button>
            <button id="tabBmBtn" class="tab-btn" onclick="switchTab('bookmark')">⭐ お気に入り (<span id="bmCount">0</span>)</button>
        </div>

        <div id="viewBookmark" class="section-view">
            <div class="card">
                <h3>⭐ お気に入り作品一覧</h3>
                <div id="bookmarks" class="bookmarks-list">
                    <p style="color: #888; font-size: 14px;">お気に入りに登録された作品はありません</p>
                </div>
            </div>
        </div>

        <div id="viewSearch" class="section-view active">
            <div class="card">
                <h3>🔍 作品を検索</h3>
                <p style="font-size: 13px; color: #888; margin: 5px 0;">Nコード（例: n2267be）または作品名（キーワード）を入力</p>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="例: 本好きの下剋上 または n2267be" value="n2267be">
                    <button class="primary" onclick="searchNovel()">検索</button>
                </div>
            </div>

            <div id="searchResultsCard" class="card" style="display:none;">
                <h3>検索結果</h3>
                <div id="searchResultsList" class="episodes-list"></div>
            </div>

            <div id="novelInfo" class="card" style="display:none;">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap;">
                    <div>
                        <h2 id="title" style="margin-top:0;"></h2>
                        <p><strong>作者:</strong> <span id="author"></span> | <strong>総話数:</strong> <span id="epCount"></span>話</p>
                    </div>
                    <button onclick="toggleBookmark()" id="bmBtn">⭐ お気に入り追加</button>
                </div>
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                <p id="synopsis" style="white-space: pre-wrap; line-height: 1.6;"></p>

                <h4>目次一覧</h4>
                <div id="episodes" class="episodes-list"></div>
            </div>

            <div id="readerView" class="card" style="display:none;">
                <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                    <button onclick="closeReader()">← 目次に戻る</button>
                    <div class="controls">
                        <button onclick="changeFontSize(2)">A+</button>
                        <button onclick="changeFontSize(-2)">A-</button>
                    </div>
                </div>

                <h3 id="epTitle" style="margin-top: 20px; text-align: center;"></h3>
                <div id="readerLoading" class="loading" style="display:none;">読み込み中...</div>
                <div id="readerContent" class="reader-content"></div>

                <div class="nav-buttons">
                    <button id="prevEpBtn" onclick="loadEpisode(currentEp - 1)">← 前の話</button>
                    <span id="epProgress" style="align-self: center; font-size: 14px;"></span>
                    <button id="nextEpBtn" onclick="loadEpisode(currentEp + 1)">次の話 →</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const SECRET_PASSWORD = "MIMI0303";

        const userInput = prompt("パスワードを入力してください：");
        if (userInput !== SECRET_PASSWORD) {
            alert("パスワードが違います。アクセスできません。");
            document.body.innerHTML = `
                <div style="text-align:center; margin-top:100px; font-family:sans-serif;">
                    <h2>🔒 閲覧権限がありません</h2>
                    <p>正しいパスワードを入力してください。</p>
                </div>
            `;
            throw new Error("Unauthorized access");
        }

        let currentNovel = null;
        let currentEp = 1;
        let fontSize = 18;

        window.onload = function() {
            renderBookmarks();
        };

        function changeTheme(theme) {
            document.body.className = theme;
        }
        window.changeTheme = changeTheme;

        function switchTab(tabName) {
            document.getElementById('viewSearch').classList.remove('active');
            document.getElementById('viewBookmark').classList.remove('active');
            document.getElementById('tabSearchBtn').classList.remove('active');
            document.getElementById('tabBmBtn').classList.remove('active');

            if (tabName === 'search') {
                document.getElementById('viewSearch').classList.add('active');
                document.getElementById('tabSearchBtn').classList.add('active');
            } else {
                document.getElementById('viewBookmark').classList.add('active');
                document.getElementById('tabBmBtn').classList.add('active');
                renderBookmarks();
            }
        }
        window.switchTab = switchTab;

        async function searchNovel() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return alert('Nコードまたは作品名を入力してください');

            const isNcode = /^[nN][0-9]{4}[a-z]{1,2}$/.test(query);

            document.getElementById('searchResultsCard').style.display = 'none';
            document.getElementById('novelInfo').style.display = 'none';
            document.getElementById('readerView').style.display = 'none';

            let targetApiUrl = `https://api.syosetu.com/novelapi/api/?out=json&of=t-n-w-s-ga&lim=1&`;
            if (isNcode) {
                targetApiUrl += `ncode=${query.toLowerCase()}`;
            } else {
                targetApiUrl += `word=${encodeURIComponent(query)}`;
            }

            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetApiUrl)}`;

            try {
                const res = await fetch(proxyUrl);
                const data = await res.json();

                if (!data || data.length < 2) {
                    alert('作品が見つかりませんでした。');
                    return;
                }

                if (!isNcode && data.length > 2) {
                    let resultsHtml = '';
                    for (let i = 1; i < data.length; i++) {
                        const item = data[i];
                        resultsHtml += `<div class="ep-item" onclick="selectNovelByNcode('${item.ncode}')">
                            <strong>${item.title}</strong> (作者: ${item.writer})
                        </div>`;
                    }
                    document.getElementById('searchResultsList').innerHTML = resultsHtml;
                    document.getElementById('searchResultsCard').style.display = 'block';
                    return;
                }

                const novelData = data[1];
                loadNovelDetails(novelData);

            } catch (err) {
                console.error(err);
                alert('API通信に失敗しました。ネット接続を確認してください。');
            }
        }
        window.searchNovel = searchNovel;

        async function selectNovelByNcode(ncode) {
            document.getElementById('searchInput').value = ncode;
            searchNovel();
        }
        window.selectNovelByNcode = selectNovelByNcode;

        function loadNovelDetails(item) {
            currentNovel = {
                ncode: item.ncode.toLowerCase(),
                title: item.title,
                writer: item.writer,
                story: item.story,
                general_all_no: item.general_all_no
            };

            document.getElementById('title').innerText = currentNovel.title;
            document.getElementById('author').innerText = currentNovel.writer;
            document.getElementById('epCount').innerText = currentNovel.general_all_no;
            document.getElementById('synopsis').innerText = currentNovel.story;

            const epContainer = document.getElementById('episodes');
            epContainer.innerHTML = '';

            const maxEp = parseInt(currentNovel.general_all_no) || 1;
            for (let i = 1; i <= maxEp; i++) {
                const div = document.createElement('div');
                div.className = 'ep-item';
                div.innerText = `第 ${i} 話`;
                div.onclick = () => openEpisode(i);
                epContainer.appendChild(div);
            }

            document.getElementById('novelInfo').style.display = 'block';
            updateBmBtn();
        }
        window.loadNovelDetails = loadNovelDetails;

        async function openEpisode(epNum) {
            currentEp = epNum;
            document.getElementById('novelInfo').style.display = 'none';
            document.getElementById('readerView').style.display = 'block';
            document.getElementById('epTitle').innerText = `第 ${epNum} 話`;
            document.getElementById('readerContent').innerText = '';
            document.getElementById('readerLoading').style.display = 'block';

            document.getElementById('epProgress').innerText = `${epNum} / ${currentNovel.general_all_no}`;
            document.getElementById('prevEpBtn').disabled = (epNum <= 1);
            document.getElementById('nextEpBtn').disabled = (epNum >= currentNovel.general_all_no);

            window.scrollTo(0, 0);

            try {
                const targetUrl = `https://ncode.syosetu.com/${currentNovel.ncode}/${epNum}/`;
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
                
                const res = await fetch(proxyUrl);
                const htmlText = await res.text();
                
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // 複数のなろうの本文クラスやIDに対応して安全に取得
                const honbun = doc.querySelector('#novel_honbun, .p-novel__text, [js-subtitle-text]');
                if (honbun && honbun.innerText.trim() !== "") {
                    document.getElementById('readerContent').innerText = honbun.innerText;
                } else {
                    // 万が一タグで見つからない場合は、公式の閲覧リンクを案内する安全設計
                    document.getElementById('readerContent').innerHTML = 
                        `本文の自動取得が制限されました。<br><br>` +
                        `<a href="${targetUrl}" target="_blank" style="color: var(--accent-color); font-weight: bold; font-size: 18px;">👉 公式サイトの第${epNum}話で読む（新しいタブで開く）</a>`;
                }
            } catch (e) {
                console.error(e);
                const targetUrl = `https://ncode.syosetu.com/${currentNovel.ncode}/${epNum}/`;
                document.getElementById('readerContent').innerHTML = 
                    `[お知らせ] セキュリティ制限により本文を直接取得できませんでした。<br><br>` +
                    `<a href="${targetUrl}" target="_blank" style="color: var(--accent-color); font-weight: bold; font-size: 18px;">👉 公式サイトの第${epNum}話で読む（新しいタブで開く）</a>`;
            } finally {
                document.getElementById('readerLoading').style.display = 'none';
            }
        }
        window.openEpisode = openEpisode;

        function loadEpisode(epNum) {
            if (epNum >= 1 && epNum <= currentNovel.general_all_no) {
                openEpisode(epNum);
            }
        }
        window.loadEpisode = loadEpisode;

        function closeReader() {
            document.getElementById('readerView').style.display = 'none';
            document.getElementById('novelInfo').style.display = 'block';
        }
        window.closeReader = closeReader;

        function changeFontSize(delta) {
            fontSize = Math.max(12, Math.min(32, fontSize + delta));
            document.getElementById('readerContent').style.fontSize = fontSize + 'px';
        }
        window.changeFontSize = changeFontSize;

        function getBookmarks() {
            return JSON.parse(localStorage.getItem('narou_bookmarks') || '[]');
        }

        function toggleBookmark() {
            if (!currentNovel) return;
            let bms = getBookmarks();
            const index = bms.findIndex(b => b.ncode === currentNovel.ncode);

            if (index >= 0) {
                bms.splice(index, 1);
            } else {
                bms.push({ 
                    ncode: currentNovel.ncode, 
                    title: currentNovel.title, 
                    writer: currentNovel.writer,
                    story: currentNovel.story,
                    general_all_no: currentNovel.general_all_no
                });
            }

            localStorage.setItem('narou_bookmarks', JSON.stringify(bms));
            updateBmBtn();
            updateBmCount();
        }
        window.toggleBookmark = toggleBookmark;

        function updateBmBtn() {
            if (!currentNovel) return;
            const bms = getBookmarks();
            const isBm = bms.some(b => b.ncode === currentNovel.ncode);
            document.getElementById('bmBtn').innerText = isBm ? "★ お気に入り解除" : "⭐ お気に入り追加";
            updateBmCount();
        }

        function updateBmCount() {
            const bms = getBookmarks();
            document.getElementById('bmCount').innerText = bms.length;
        }

        function renderBookmarks() {
            const bms = getBookmarks();
            const container = document.getElementById('bookmarks');
            updateBmCount();

            if (bms.length === 0) {
                container.innerHTML = '<p style="color: #888; font-size: 14px;">お気に入りに登録された作品はありません</p>';
                return;
            }

            container.innerHTML = '';
            bms.forEach(bm => {
                const div = document.createElement('div');
                div.className = 'bm-item';
                div.innerHTML = `<div><strong>${bm.title}</strong><br><small style="color:#888;">作者: ${bm.writer}</small></div>`;
                div.onclick = () => {
                    switchTab('search');
                    loadNovelDetails(bm);
                };
                container.appendChild(div);
            });
        }
        window.renderBookmarks = renderBookmarks;
    </script>
</body>
</html>
